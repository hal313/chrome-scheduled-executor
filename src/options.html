<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scheduled Executor</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>Scheduled Executor</h1>

    <form id="form">
      <label class="row checkbox">
        <input type="checkbox" id="enabled">
        Polling enabled
      </label>

      <div class="times">
        <label>Start
          <input type="time" id="startTime" required>
        </label>
        <label>Stop
          <input type="time" id="stopTime" required>
        </label>
      </div>
      <p class="hint" id="windowHint"></p>

      <label>URL pattern (regular expression)
        <input type="text" id="url" spellcheck="false" placeholder="teams\.microsoft\.com">
      </label>
      <p class="hint" id="urlHint"></p>

      <button type="submit">Save</button>
      <span id="saved" class="saved" hidden>Saved</span>
    </form>

    <section class="status">
      <h2>Status</h2>
      <p id="state"></p>
      <p id="lastStatus" class="hint"></p>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
